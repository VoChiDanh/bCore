name: Dev Build
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 16
        uses: actions/setup-java@v2
        with:
          java-version: '16'
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - uses: "actions/upload-artifact@v3"
        with:
          name: "[DevBuild] bCore"
          path: ./target/bCore.jar
      - uses: jungwinter/split@v2
        id: split
        with:
          msg: ${{github.repository}}
          separator: "/"
      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: YYYYMMDD-HH
          utcOffset: "+07:00"
      - name: Use current time
        env:
          TIME: "${{ steps.current-time.outputs.time }}"
          R_TIME: "${{ steps.current-time.outputs.readableTime }}"
          F_TIME: "${{ steps.current-time.outputs.formattedTime }}"
          YEAR: "${{ steps.current-time.outputs.year }}"
          DAY: "${{ steps.current-time.outputs.day }}"
        run: echo $TIME $R_TIME $F_TIME $YEAR $DAY
      - name: Discord Webhook Action
        uses: tsickert/discord-webhook@v4.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "${{ steps.split.outputs._1 }}"
          embed-title: "Dev Build"
          avatar-url: "https://github.com/${{ steps.split.outputs._0 }}.png"
          embed-color: "65280"
          embed-author-name: "VoChiDanh"
          embed-author-icon-url: "https://github.com/VoChiDanh.png"
          embed-author-url: "https://github.com/VoChiDanh"
          embed-thumbnail-url: "https://github.com/${{ steps.split.outputs._0 }}/${{ steps.split.outputs._1 }}"
          embed-footer-icon-url:  "https://i.imgur.com/YprbQRMb.jpg"
          embed-footer-text: "v2.0"
          embed-timestamp: "$F_TIME"
          embed-description: |
            ${{ github.event.head_commit.message }}
#          filename: ./target/bCore.jar
