name: Dev Build
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 16
        uses: actions/setup-java@v2
        with:
          java-version: '16'
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: Discord Webhook Action
        uses: tsickert/discord-webhook@v4.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          username: "Dev Build"
          content: "This is a new beta version of bCore plugin! You can download and use it!"
          filename: ./target/bCore.jar
      - uses: "actions/upload-artifact@v3"
        with:
          name: "[DevBuild] bCore"
          path: ./target/bCore.jar
