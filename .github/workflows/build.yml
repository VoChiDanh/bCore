name: Build
on:
  push:
    branches: [ 0.2.2 ]
jobs:
  build:
    if: contains(github.event.head_commit.message, 'v0.3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "v0.3"
          prerelease: false
          title: "bCore - v0.3"
          files: |
            ./target/bCore.jar
